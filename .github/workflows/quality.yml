# Public runners are UNMETERED, so unlike the private repository this fans out.
# Parallel jobs finish sooner and each failure names itself in the checks list,
# which matters more here because someone else may be reading it.
name: quality

# Every `uses:` here is pinned to a commit, with the version it was at in a
# trailing comment. A git tag is a movable label: whoever can push to one of
# these third-party repositories can change what `@v2` means, and these jobs
# run on every pull request, including one opened by a stranger. A commit
# cannot be moved.
#
# The cost of a pin is that it goes stale quietly, and the usual answer is a bot
# opening a pull request every month. This repository does not take that trade:
# its history is meant to read as one person's work, and a bot in the commit
# list and the pull-request list is not that. So these lines are refreshed by
# hand, and the date below says when that last happened.
#
# Pins last reviewed: 2026-09-12.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16.0.0
        with:
          globs: '**/*.md'

  spell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # HARD fail here. In the private repo notes are drafts and this only
      # warns; here the writing IS the deliverable.
      - uses: streetsidesoftware/cspell-action@e464ae97d348eb3beb0c5a6296dc4388ad4484d9 # v6.11.1
        with:
          config: cspell.config.yaml
          inline: error
          strict: true

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true

  cff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The citation button is the highest value-per-byte thing in this repo
      # for a PhD applicant. A malformed CITATION.cff silently disables it.
      - uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: "--validate"

  # The job id is kept as `tools-parity` because the main ruleset requires a
  # status check by exactly that name, pinned to this integration; renaming
  # the job and the ruleset entry cannot be done atomically, and a required
  # check that never reports blocks every merge. What the job DOES has changed.
  #
  # It used to assert parity between a mirrored toolbox and its private source,
  # and short-circuit to a green `echo` when the mirror was absent — which it
  # always was. An audit called that out: a required check that is structurally
  # incapable of failing is a false reading on every pull request. It now runs
  # the public toolbox's own test suite, and fails loudly if there is no
  # toolbox to test.
  tools-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - name: The public toolbox exists and its tests pass
        run: |
          if [ ! -d tools/tests ]; then
            echo "::error title=No public toolbox::tools/tests/ is absent, so this check would be asserting nothing"
            exit 1
          fi
          pip install --quiet pytest
          python -m pytest tools/tests -q
